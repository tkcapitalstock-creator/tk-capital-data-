name: Update market data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run updater
        run: python scripts/update_data.py

      - name: Commit changes
        run: |
          git config user.name "tk-capital-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ticker.json headlines.json
          git diff --staged --quiet || git commit -m "Update market data"
          git push
